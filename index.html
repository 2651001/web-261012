<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 영화 보드</title>
    <!-- 구글 폰트 링크 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>내 영화 보드</h1>
    <article class="card">
        <!-- 인터스텔라 TMDB 포스터 경로 예시 (실제 poster_path 적용) -->
        <img class="poster" src="https://image.tmdb.org/t/p/w342/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" alt="인터스텔라 포스터">
        <span class="badge">8.4</span>
        <div class="info">
            <h2>인터스텔라</h2>
            <p class="year">2014</p>
            <p class="overview">세계 각국의 정부와 경제가 완전히 붕괴된 미래가 다가온다.</p>
        </div>
    </article>
    <footer>
        <p>이 사이트는 TMDB API를 사용하지만 TMDB의 보증이나 인증을 받지 않았습니다.
            This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
        <p>포스터와 영화 정보: TMDB (https://www.themoviedb.org)</p>
    </footer>
</body>

</html>
